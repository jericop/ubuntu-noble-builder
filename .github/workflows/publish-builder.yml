name: publish-builder

on:
  push:
    branches:
      - skip-chown-lifecycle
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup pack
        run: |
          PACK_VERSION=$(curl -s https://api.github.com/repos/buildpacks/pack/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          curl -sSL "https://github.com/buildpacks/pack/releases/download/v${PACK_VERSION}/pack-v${PACK_VERSION}-linux.tgz" | tar -xz -C /usr/local/bin
          pack version
      - uses: azure/docker-login@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create and publish builder
        run: |
          pack builder create jericop/ubuntu-noble-builder:skip-chown-poc \
            --config ./builders/builder/builder.toml \
            --publish
          echo "Published: jericop/ubuntu-noble-builder:skip-chown-poc"
