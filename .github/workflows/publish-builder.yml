name: publish-builder
# Manual only. Pass `pack_ref` (a branch or tag of jericop/pack); the builder is built
# with a pack binary from that ref and the published builder image tag is DERIVED from
# that ref. The builder repo itself (builder.toml + this workflow) is checked out from
# whatever branch you run the workflow from.
on:
  workflow_dispatch:
    inputs:
      pack_ref:
        description: "jericop/pack git ref to build the pack binary from (branch or tag). The builder image tag is derived from this."
        required: false
        default: "buildkit-native-export"

env:
  # NOTE: builders/builder/builder.toml pins [lifecycle].uri to
  # jericop/lifecycle:buildkit-native-export-v0.1.0. If you publish a builder under a
  # different tag, make sure the bundled lifecycle tag is what you intend.
  #
  # The builder image tag is derived per-job from pack_ref (see "Resolve builder tag");
  # this default only applies if pack_ref is somehow empty.
  DEFAULT_BUILDER_TAG: buildkit-native-export
  # Pack fork ref built from source and used to `pack builder create`.
  PACK_REF: ${{ github.event.inputs.pack_ref || 'buildkit-native-export' }}

jobs:
  publish:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux/amd64
            tag-suffix: -amd64
          - runner: ubuntu-24.04-arm
            target: linux/arm64
            tag-suffix: -arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve builder tag
        shell: bash
        run: |
          # Derive the builder image tag from PACK_REF (the manually-provided pack ref).
          # A semver-line ref (buildkit-native-export-v*) publishes under that tag
          # verbatim so builder/lifecycle/pack share one immutable tag; any other ref
          # (a branch) publishes a moving tag named after the ref.
          REF="${PACK_REF:-$DEFAULT_BUILDER_TAG}"
          case "${REF}" in
            buildkit-native-export-v*) BUILDER_TAG="${REF}";;
            *)                         BUILDER_TAG="${REF}";;
          esac
          echo "BUILDER_TAG=${BUILDER_TAG}" >> "$GITHUB_ENV"
          echo "Resolved BUILDER_TAG=${BUILDER_TAG} (from PACK_REF=${PACK_REF})"
      - name: Checkout pack (buildkit fork)
        uses: actions/checkout@v5
        with:
          repository: jericop/pack
          ref: ${{ env.PACK_REF }}
          path: pack-src
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: pack-src/go.mod
      - name: Build pack from source
        run: |
          cd pack-src
          go build -o /usr/local/bin/pack .
          pack version
      - uses: azure/docker-login@v2
        with:
          username: ${{ secrets.PAKETO_BUILDPACKS_DOCKERHUB_USERNAME }}
          password: ${{ secrets.PAKETO_BUILDPACKS_DOCKERHUB_PASSWORD }}
      - name: Create and publish builder
        run: |
          pack builder create ${{ secrets.DOCKERHUB_ORG }}/ubuntu-noble-builder:${BUILDER_TAG}${{ matrix.tag-suffix }} \
            --config ./builders/builder/builder.toml \
            --target ${{ matrix.target }} \
            --publish

  manifest:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve builder tag
        shell: bash
        run: |
          # Same derivation as the publish job: builder tag comes from PACK_REF.
          REF="${PACK_REF:-$DEFAULT_BUILDER_TAG}"
          case "${REF}" in
            buildkit-native-export-v*) BUILDER_TAG="${REF}";;
            *)                         BUILDER_TAG="${REF}";;
          esac
          echo "BUILDER_TAG=${BUILDER_TAG}" >> "$GITHUB_ENV"
          echo "Resolved BUILDER_TAG=${BUILDER_TAG} (from PACK_REF=${PACK_REF})"
      - uses: azure/docker-login@v2
        with:
          username: ${{ secrets.PAKETO_BUILDPACKS_DOCKERHUB_USERNAME }}
          password: ${{ secrets.PAKETO_BUILDPACKS_DOCKERHUB_PASSWORD }}
      - name: Create manifest list
        run: |
          docker manifest create ${{ secrets.DOCKERHUB_ORG }}/ubuntu-noble-builder:${BUILDER_TAG} \
            ${{ secrets.DOCKERHUB_ORG }}/ubuntu-noble-builder:${BUILDER_TAG}-amd64 \
            ${{ secrets.DOCKERHUB_ORG }}/ubuntu-noble-builder:${BUILDER_TAG}-arm64
          docker manifest push ${{ secrets.DOCKERHUB_ORG }}/ubuntu-noble-builder:${BUILDER_TAG}
          echo "Published manifest list: ${{ secrets.DOCKERHUB_ORG }}/ubuntu-noble-builder:${BUILDER_TAG}"
