description = "Ubuntu 24.04 Noble Numbat base image with no buildpacks included. To use, specify buildpacks at build time."

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.114"

[lifecycle]
  # Moving branch tag (republished by publish-lifecycle.yml with ref=buildkit-native-export),
  # matching the default builder. Publish the lifecycle before rebuilding this builder so
  # it bundles the latest. Not immutable — pin a buildkit-native-export-v* tag if you need
  # a reproducible builder.
  uri = "docker://docker.io/jericop/lifecycle:buildkit-native-export"

[run]

  [[run.images]]
    image = "docker.io/paketobuildpacks/ubuntu-noble-run:latest"

[stack]
  id = "io.buildpacks.stacks.noble"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
