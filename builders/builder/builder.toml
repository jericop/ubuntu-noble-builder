description = "Ubuntu 24.04 Noble Numbat base image with buildpacks for Apache HTTPD, Go, Java, Java Native Image, .NET, NGINX, Node.js, PHP, Procfile, Python, and Ruby"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.114"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/dotnet-core:4.7.2"
  version = "4.7.2"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/go:4.19.24"
  version = "4.19.24"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java-native-image:14.9.0"
  version = "14.9.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java:22.3.0"
  version = "22.3.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:10.9.1"
  version = "10.9.1"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/php:3.2.0"
  version = "3.2.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.13.6"
  version = "5.13.6"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/python:2.58.0"
  version = "2.58.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/ruby:2.4.1"
  version = "2.4.1"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.9.0"
  version = "4.9.0"

[lifecycle]
  # Pinned to the buildkit-native-export lifecycle line: single builder-agnostic
  # buildkit backend, prepared-metadata label, -skip-chown; no OCI-layout mode /
  # -pull-run-image. This branch (buildkit-native-export-with-history-and-kiro) bundles
  # the MATCHING history-and-kiro lifecycle image, republished by publish-lifecycle.yml
  # with ref=buildkit-native-export-with-history-and-kiro. Moving tag: republishing that
  # lifecycle changes what a rebuilt builder bundles (this keeps the builder + lifecycle +
  # pack all on the -with-history-and-kiro line, incl. the FR-9 finalize timing logging).
  uri = "docker://docker.io/jericop/lifecycle:buildkit-native-export-with-history-and-kiro"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/ruby"
    version = "2.4.1"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/dotnet-core"
    version = "4.7.2"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/go"
    version = "4.19.24"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/python"
    version = "2.58.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/php"
    version = "3.2.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.9.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java-native-image"
    version = "14.9.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java"
    version = "22.3.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/nodejs"
    version = "10.9.1"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.13.6"

[run]

  [[run.images]]
    image = "docker.io/paketobuildpacks/ubuntu-noble-run:latest"

[stack]
  id = "io.buildpacks.stacks.noble"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
